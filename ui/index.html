<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI-EMS Agent</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #f4f6f8; }
    header { height: 64px; padding: 0 24px; display: flex; align-items: center; background: #1f2937; color: white; }
    header h1 { margin: 0; font-size: 22px; }
    main { height: calc(100vh - 64px); padding: 16px; display: grid; grid-template-columns: 2fr 1fr; gap: 16px; }
    .panel { background: white; border-radius: 8px; border: 1px solid #d1d5db; overflow: hidden; }
    .panel-title { padding: 12px 16px; font-weight: bold; border-bottom: 1px solid #e5e7eb; }
    #map { position: relative; height: calc(100% - 46px); display: flex; align-items: center; justify-content: center; color: #6b7280; }
    #network-map { width: 100%; height: 100%; }

    .map-layer-control { position: absolute; z-index: 15; top: 12px; right: 12px; min-width: 132px; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background: rgba(255,255,255,.94); box-shadow: 0 4px 16px rgba(15,23,42,.12); color: #334155; font-size: 12px; }
    .map-layer-control strong { display: block; margin-bottom: 7px; color: #0f172a; }
    .map-layer-option { display: flex; align-items: center; gap: 7px; margin-top: 5px; cursor: pointer; user-select: none; }
    .map-layer-option input { margin: 0; }

    .network-line { stroke: #94a3b8; stroke-width: 1; opacity: .65; pointer-events: none; }
    .network-line.hover-line, .network-line.selected-line { stroke: #475569; stroke-width: 3; opacity: 1; }
    .network-line.outage-line { stroke: #dc2626; stroke-width: 5; opacity: 1; }
    .network-line.violation-line { stroke: #f59e0b; stroke-width: 5; opacity: 1; }
    .network-line-hit { stroke: transparent; stroke-width: 14; fill: none; pointer-events: stroke; cursor: pointer; }
    .network-bus { fill: #2563eb; stroke: white; stroke-width: .6; cursor: pointer; }
    .network-bus:hover, .network-bus.selected-bus { r: 5; }
    .network-bus.selected-bus { fill: #0f172a; }

    .network-generator { cursor: pointer; }
    .network-generator path { fill: #16a34a; stroke: white; stroke-width: 1.4; }
    .network-generator text { fill: white; font-size: 8px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .network-generator.selected-generator path { fill: #0f172a; stroke-width: 2.5; }

    .analysis-marker { cursor: pointer; }
    .generator-outage-marker path { fill: #dc2626; stroke: white; stroke-width: 2; }
    .generator-outage-marker text, .generator-change-marker text { fill: white; font-size: 8px; font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
    .generator-change-marker circle, .sensitivity-marker circle { fill: #7c3aed; stroke: white; stroke-width: 2; }
    .sensitivity-marker text { fill: white; font-size: 9px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }

    .layer-hidden { display: none !important; }
    #map.analysis-hidden .analysis-marker { display: none !important; }
    #map.analysis-hidden .network-line.outage-line,
    #map.analysis-hidden .network-line.violation-line { stroke: #94a3b8; stroke-width: 1; opacity: .65; }

    .map-tooltip { position: absolute; z-index: 20; display: none; min-width: 220px; max-width: 360px; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 8px; background: rgba(255,255,255,.98); box-shadow: 0 8px 24px rgba(15,23,42,.18); color: #0f172a; font-size: 13px; line-height: 1.55; pointer-events: auto; user-select: text; }
    .map-tooltip-title { margin: 0 24px 6px 0; font-size: 14px; font-weight: 700; }
    .map-tooltip-row { color: #475569; }
    .map-tooltip-row strong { color: #0f172a; }
    .map-tooltip-close { position: absolute; top: 5px; right: 7px; width: 24px; height: 24px; padding: 0; border: 0; background: transparent; color: #64748b; font-size: 18px; cursor: pointer; }
    .generator-choice { display: block; width: 100%; padding: 5px 7px; margin-top: 2px; border: 0; border-radius: 5px; background: transparent; text-align: left; color: #475569; cursor: pointer; }
    .generator-choice:hover { background: #eef2ff; color: #1e293b; }
    .generator-choice strong { color: #0f172a; }
    .generator-choice.disconnected-generator { color: #94a3b8; }
    .generator-choice.disconnected-generator strong { color: #64748b; }
    .generator-status { margin-left: 4px; font-size: 11px; font-weight: 700; }
    .generator-status.disconnected { color: #dc2626; }

    #chat { height: calc(100% - 46px); padding: 16px; display: flex; flex-direction: column; }
    #messages { flex: 1; overflow-y: auto; }
    #chat-log { margin-top: 16px; display: flex; flex-direction: column; gap: 10px; }
    .chat-message { padding: 10px 12px; border-radius: 8px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
    .chat-message.user { align-self: flex-end; max-width: 88%; background: #dbeafe; }
    .chat-message.agent { align-self: flex-start; max-width: 96%; background: #f1f5f9; }
    .chat-message.system { align-self: stretch; background: #fff7ed; color: #9a3412; }
    #chat-input { display: flex; gap: 8px; margin-top: 12px; }
    #chat-input input { flex: 1; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; }
    #chat-input button { padding: 10px 16px; border: none; border-radius: 6px; cursor: pointer; }
    #chat-input button:disabled { cursor: not-allowed; opacity: .6; }

    .analysis-box { margin-bottom: 16px; padding: 12px; border: 1px solid #e5e7eb; border-radius: 8px; background: #f8fafc; }
    .analysis-box-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; cursor: pointer; user-select: none; }
    .analysis-box-header strong { flex: 1; }
    .analysis-box .analysis-toggle { width: auto; min-width: 32px; padding: 2px 7px; border: 0; background: transparent; color: #64748b; font-size: 17px; line-height: 1.2; }
    .analysis-box .analysis-toggle:hover { background: #e2e8f0; }
    .analysis-box-content { margin-top: 8px; }
    .analysis-box.collapsed .analysis-box-content { display: none; }
    .analysis-box input[type="text"] { width: 100%; margin-top: 6px; margin-bottom: 8px; padding: 8px; }
    .analysis-box button { width: 100%; padding: 9px; border: none; border-radius: 6px; cursor: pointer; }
    .analysis-box button:disabled { cursor: not-allowed; opacity: .6; }
    .analysis-subtitle { display: block; margin-top: 8px; margin-bottom: 4px; font-size: 12px; color: #475569; }
    .slack-options { display: flex; gap: 14px; margin: 8px 0 10px; font-size: 13px; }
    .slack-options label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    #security-result, #sensitivity-result, #generator-contingency-result { margin-top: 12px; line-height: 1.6; }
    .sensitivity-button { margin-top: 10px; }
    .sensitivity-candidate, .generator-result-section { margin-top: 8px; padding-top: 8px; border-top: 1px solid #e5e7eb; }
    .generator-result-row { margin-top: 2px; }
    .generator-result-note { margin-top: 8px; color: #64748b; font-size: 12px; }
    .generator-state-note { color: #b45309; }
  </style>
</head>
<body>
  <header><h1>AI-EMS Agent</h1></header>
  <main>
    <section class="panel">
      <div class="panel-title">KPG-193 Network</div>
      <div id="map">
        <svg id="network-map" viewBox="0 0 700 900" preserveAspectRatio="xMidYMid meet"></svg>
        <div class="map-layer-control">
          <strong>지도 표시</strong>
          <label class="map-layer-option"><input id="layer-lines" type="checkbox" checked /><span>선로</span></label>
          <label class="map-layer-option"><input id="layer-buses" type="checkbox" checked /><span>버스</span></label>
          <label class="map-layer-option"><input id="layer-generators" type="checkbox" /><span>발전기</span></label>
          <label class="map-layer-option"><input id="layer-analysis" type="checkbox" checked /><span>분석 결과</span></label>
        </div>
        <div id="map-tooltip" class="map-tooltip">
          <button id="map-tooltip-close" class="map-tooltip-close">×</button>
          <div id="map-tooltip-content"></div>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">AI Assistant</div>
      <div id="chat">
        <div id="messages">
          <div class="analysis-box" id="security-analysis-box">
            <div class="analysis-box-header" data-box-id="security-analysis-box">
              <strong>Security Analysis</strong>
              <button type="button" class="analysis-toggle" aria-expanded="true" title="접기">▾</button>
            </div>
            <div class="analysis-box-content">
              <input id="outage-line" type="text" value="LINE-16-28" placeholder="Outage line ID" />
              <button id="analyze-button">Analyze</button>
              <div id="security-result">사고 선로를 입력하고 분석하세요.</div>
              <button id="sensitivity-button" class="sensitivity-button" disabled>Sensitivity Analysis</button>
              <div id="sensitivity-result">Security Analysis 후 민감도를 분석할 수 있습니다.</div>
            </div>
          </div>

          <div class="analysis-box" id="generator-contingency-box">
            <div class="analysis-box-header" data-box-id="generator-contingency-box">
              <strong>Generator Contingency Analysis</strong>
              <button type="button" class="analysis-toggle" aria-expanded="true" title="접기">▾</button>
            </div>
            <div class="analysis-box-content">
              <span class="analysis-subtitle">지도에서 발전기 행을 클릭하면 자동으로 입력됩니다.</span>
              <input id="outage-generator" type="text" placeholder="Generator ID (예: GEN-124#1)" />
              <div class="slack-options">
                <label><input type="radio" name="generator-slack-mode" value="single" checked /> Single</label>
                <label><input type="radio" name="generator-slack-mode" value="distributed" /> Distributed</label>
              </div>
              <button id="generator-analyze-button">Analyze</button>
              <div id="generator-contingency-result">발전기를 선택하거나 ID를 입력하고 분석하세요.</div>
            </div>
          </div>

          <div id="chat-log"></div>
        </div>
        <div id="chat-input">
          <input id="chat-message" type="text" placeholder="계통 분석을 요청하세요." />
          <button id="chat-send">전송</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const SVG_NS = "http://www.w3.org/2000/svg";
    const SESSION_STORAGE_KEY = "ai-ems-agent-session-id";
    let mapProjection = null;
    let chatBusy = false;
    let latestSecurityResult = null;
    let generatorStateMap = new Map();

    function getSessionId() {
      let sessionId = sessionStorage.getItem(SESSION_STORAGE_KEY);
      if (!sessionId) {
        sessionId = crypto.randomUUID();
        sessionStorage.setItem(SESSION_STORAGE_KEY, sessionId);
      }
      return sessionId;
    }

    async function loadNetworkMap() {
      const response = await fetch("/api/network-map");
      const data = await response.json();
      generatorStateMap = new Map((data.generators || []).map((item) => [item.generator_id, item]));
      drawNetwork(data);
      applyLayerVisibility();
      updateGeneratorAnalyzeAvailability();
    }

    function setAnalysisBoxCollapsed(boxId, collapsed) {
      const box = document.getElementById(boxId);
      if (!box) return;
      box.classList.toggle("collapsed", collapsed);
      const button = box.querySelector(".analysis-toggle");
      if (button) {
        button.textContent = collapsed ? "▸" : "▾";
        button.setAttribute("aria-expanded", String(!collapsed));
        button.title = collapsed ? "펼치기" : "접기";
      }
    }

    function toggleAnalysisBox(boxId) {
      const box = document.getElementById(boxId);
      if (!box) return;
      setAnalysisBoxCollapsed(boxId, !box.classList.contains("collapsed"));
    }

    function drawNetwork(data) {
      const svg = document.getElementById("network-map");
      const width = 700;
      const height = 900;
      const padding = 40;
      const minLat = Math.min(...data.buses.map((b) => b.latitude));
      const maxLat = Math.max(...data.buses.map((b) => b.latitude));
      const minLon = Math.min(...data.buses.map((b) => b.longitude));
      const maxLon = Math.max(...data.buses.map((b) => b.longitude));
      const busMap = new Map(data.buses.map((bus) => [bus.bus_id, bus]));

      mapProjection = (bus) => ({
        x: padding + ((bus.longitude - minLon) / (maxLon - minLon)) * (width - padding * 2),
        y: padding + ((maxLat - bus.latitude) / (maxLat - minLat)) * (height - padding * 2),
      });

      for (const line of data.lines) {
        const bus1 = busMap.get(line.bus1_id);
        const bus2 = busMap.get(line.bus2_id);
        if (!bus1 || !bus2) continue;
        const p1 = mapProjection(bus1);
        const p2 = mapProjection(bus2);

        const element = document.createElementNS(SVG_NS, "line");
        element.setAttribute("x1", p1.x); element.setAttribute("y1", p1.y);
        element.setAttribute("x2", p2.x); element.setAttribute("y2", p2.y);
        element.setAttribute("class", "network-line layer-line");
        element.dataset.lineId = line.line_id;
        svg.appendChild(element);

        const hit = document.createElementNS(SVG_NS, "line");
        hit.setAttribute("x1", p1.x); hit.setAttribute("y1", p1.y);
        hit.setAttribute("x2", p2.x); hit.setAttribute("y2", p2.y);
        hit.setAttribute("class", "network-line-hit layer-line");
        hit.dataset.lineId = line.line_id;
        hit.addEventListener("mouseenter", () => element.classList.add("hover-line"));
        hit.addEventListener("mouseleave", () => element.classList.remove("hover-line"));
        hit.addEventListener("click", (event) => {
          event.stopPropagation();
          clearMapSelection();
          element.classList.add("selected-line");
          setAnalysisBoxCollapsed("security-analysis-box", false);
          document.getElementById("outage-line").value = line.line_id;
          invalidateSecurityResult();
          showLineTooltip(event, line, bus1, bus2);
        });
        svg.appendChild(hit);
      }

      for (const bus of data.buses) {
        const p = mapProjection(bus);
        const element = document.createElementNS(SVG_NS, "circle");
        element.setAttribute("cx", p.x); element.setAttribute("cy", p.y); element.setAttribute("r", 3);
        element.setAttribute("class", "network-bus layer-bus");
        element.dataset.busId = bus.bus_id;
        element.addEventListener("click", (event) => {
          event.stopPropagation();
          clearMapSelection();
          element.classList.add("selected-bus");
          showBusTooltip(event, bus);
        });
        svg.appendChild(element);
      }

      renderGeneratorLayer(data.generators || []);
    }

    function groupByBus(items) {
      const groups = new Map();
      for (const item of items) {
        if (item.bus_id == null) continue;
        if (!groups.has(item.bus_id)) groups.set(item.bus_id, []);
        groups.get(item.bus_id).push(item);
      }
      return groups;
    }

    function renderGeneratorLayer(generators) {
      if (!mapProjection) return;
      const svg = document.getElementById("network-map");
      for (const [busId, items] of groupByBus(generators).entries()) {
        const first = items[0];
        if (first.latitude == null || first.longitude == null) continue;
        const p = mapProjection(first);
        const group = document.createElementNS(SVG_NS, "g");
        group.setAttribute("class", "network-generator layer-generator");
        group.dataset.busId = busId;

        const path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", `M ${p.x} ${p.y - 8} L ${p.x - 7} ${p.y + 6} L ${p.x + 7} ${p.y + 6} Z`);
        const text = document.createElementNS(SVG_NS, "text");
        text.setAttribute("x", p.x); text.setAttribute("y", p.y + 1); text.textContent = items.length;
        group.appendChild(path); group.appendChild(text);
        group.addEventListener("click", (event) => {
          event.stopPropagation();
          showGeneratorTooltip(event, busId, items);
        });
        svg.appendChild(group);
      }
    }

    function applyLayerVisibility() {
      setLayerHidden(".layer-line", !document.getElementById("layer-lines").checked);
      setLayerHidden(".layer-bus", !document.getElementById("layer-buses").checked);
      setLayerHidden(".layer-generator", !document.getElementById("layer-generators").checked);
      document.getElementById("map").classList.toggle("analysis-hidden", !document.getElementById("layer-analysis").checked);
    }

    function setLayerHidden(selector, hidden) {
      document.querySelectorAll(selector).forEach((el) => el.classList.toggle("layer-hidden", hidden));
    }

    function clearMapSelection() {
      document.querySelectorAll(".selected-line").forEach((el) => el.classList.remove("selected-line"));
      document.querySelectorAll(".selected-bus").forEach((el) => el.classList.remove("selected-bus"));
    }

    function updateGeneratorAnalyzeAvailability() {
      const generatorId = document.getElementById("outage-generator").value.trim();
      const button = document.getElementById("generator-analyze-button");
      const resultElement = document.getElementById("generator-contingency-result");
      const generator = generatorStateMap.get(generatorId);

      if (generator && generator.connected === false) {
        button.disabled = true;
        resultElement.innerHTML = `<span class="generator-state-note"><strong>${escapeHtml(generatorId)}</strong>은 현재 계통에서 이미 분리된 발전기입니다. 이미 disconnected 상태이므로 추가 발전기 탈락 N-1 분석 대상이 아닙니다.</span>`;
        return false;
      }

      button.disabled = false;
      return true;
    }

    function selectGenerator(generatorId, busId) {
      setAnalysisBoxCollapsed("generator-contingency-box", false);
      document.getElementById("outage-generator").value = generatorId;
      document.querySelectorAll(".network-generator").forEach((el) => {
        el.classList.toggle("selected-generator", String(el.dataset.busId) === String(busId));
      });

      if (updateGeneratorAnalyzeAvailability()) {
        document.getElementById("generator-contingency-result").textContent = `${generatorId} 선택됨. Slack mode를 선택하고 Analyze를 실행하세요.`;
      }
      hideMapTooltip(false);
    }

    function showBusTooltip(event, bus) {
      showMapTooltip(event, `
        <div class="map-tooltip-title">Bus ${bus.bus_id}</div>
        <div class="map-tooltip-row"><strong>지역</strong>: ${bus.name_korean}</div>
        <div class="map-tooltip-row"><strong>English</strong>: ${bus.name_english}</div>`);
    }

    function showLineTooltip(event, line, bus1, bus2) {
      showMapTooltip(event, `
        <div class="map-tooltip-title">${line.line_id}</div>
        <div class="map-tooltip-row"><strong>From</strong>: Bus ${line.bus1_id} · ${bus1.name_korean}</div>
        <div class="map-tooltip-row"><strong>To</strong>: Bus ${line.bus2_id} · ${bus2.name_korean}</div>`);
    }

    function showGeneratorTooltip(event, busId, generators) {
      const first = generators[0];
      const rows = generators.map((item) => {
        const target = item.target_p_mw == null ? "" : ` · Target ${item.target_p_mw.toFixed(2)} MW`;
        const disconnected = item.connected === false;
        const status = disconnected ? `<span class="generator-status disconnected">Disconnected</span>` : "";
        const rowClass = disconnected ? "generator-choice disconnected-generator" : "generator-choice";
        return `<button type="button" class="${rowClass}" data-generator-id="${escapeHtml(item.generator_id)}" data-bus-id="${busId}"><strong>${escapeHtml(item.generator_id)}</strong>${target}${status}</button>`;
      }).join("");

      showMapTooltip(event, `
        <div class="map-tooltip-title">Bus ${busId} · ${escapeHtml(first.name_korean ?? "-")}</div>
        <div class="map-tooltip-row"><strong>발전기</strong>: ${generators.length}개 · 분석할 발전기를 클릭하세요.</div>
        ${rows}`);

      document.querySelectorAll(".generator-choice").forEach((button) => {
        button.addEventListener("click", (clickEvent) => {
          clickEvent.stopPropagation();
          selectGenerator(button.dataset.generatorId, button.dataset.busId);
        });
      });
    }

    function showSensitivityTooltip(event, busId, generators) {
      const first = generators[0];
      const rows = generators.map((item) => `<div class="map-tooltip-row"><strong>${escapeHtml(item.generator_id)}</strong>: ${item.sensitivity.toFixed(4)}</div>`).join("");
      showMapTooltip(event, `<div class="map-tooltip-title">Bus ${busId} · ${escapeHtml(first.name_korean)}</div>${rows}`);
    }

    function showGeneratorContingencyTooltip(event, title, items) {
      const rows = items.map((item) => {
        const delta = item.delta_generation_mw;
        const deltaText = delta == null ? "" : ` · ΔP ${delta >= 0 ? "+" : ""}${delta.toFixed(2)} MW`;
        return `<div class="map-tooltip-row"><strong>${escapeHtml(item.generator_id)}</strong>${deltaText}</div>`;
      }).join("");
      showMapTooltip(event, `<div class="map-tooltip-title">${escapeHtml(title)}</div>${rows}`);
    }

    function showMapTooltip(event, html) {
      const map = document.getElementById("map");
      const tooltip = document.getElementById("map-tooltip");
      const rect = map.getBoundingClientRect();
      document.getElementById("map-tooltip-content").innerHTML = html;
      tooltip.style.display = "block";
      const margin = 12;
      let left = event.clientX - rect.left + margin;
      let top = event.clientY - rect.top + margin;
      if (left + tooltip.offsetWidth > rect.width - margin) left = event.clientX - rect.left - tooltip.offsetWidth - margin;
      if (top + tooltip.offsetHeight > rect.height - margin) top = rect.height - tooltip.offsetHeight - margin;
      tooltip.style.left = `${Math.max(margin, left)}px`;
      tooltip.style.top = `${Math.max(margin, top)}px`;
    }

    function hideMapTooltip(clearSelection = true) {
      document.getElementById("map-tooltip").style.display = "none";
      if (clearSelection) clearMapSelection();
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>'"]/g, (ch) => ({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]));
    }

    function resetSecurityHighlight() {
      document.querySelectorAll(".network-line").forEach((line) => line.classList.remove("outage-line", "violation-line"));
    }

    function highlightLine(lineId, className) {
      document.querySelectorAll(".network-line").forEach((line) => {
        if (line.dataset.lineId === lineId) line.classList.add(className);
      });
    }

    async function runSecurityAnalysis() {
      const outageLineId = document.getElementById("outage-line").value.trim();
      if (!outageLineId) return;
      const resultElement = document.getElementById("security-result");
      resultElement.textContent = "분석 중...";
      latestSecurityResult = null;
      document.getElementById("sensitivity-button").disabled = true;
      resetSecurityHighlight(); resetSensitivityMarkers(); resetGeneratorContingencyMarkers(); hideMapTooltip();
      document.getElementById("sensitivity-result").textContent = "Security Analysis 후 민감도를 분석할 수 있습니다.";
      try {
        const response = await fetch("/api/security-analysis?outage_line_id=" + encodeURIComponent(outageLineId));
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        applySecurityResult(await response.json());
      } catch (error) { resultElement.textContent = `분석 실패: ${error.message}`; }
    }

    function applySecurityResult(result) {
      setAnalysisBoxCollapsed("security-analysis-box", false);
      if (result.outage_line_id) document.getElementById("outage-line").value = result.outage_line_id;
      resetSecurityHighlight(); resetSensitivityMarkers(); resetGeneratorContingencyMarkers();
      highlightLine(result.outage_line_id, "outage-line");
      for (const v of result.violations || []) highlightLine(v.equipment_id, "violation-line");
      renderSecurityResult(result);
      latestSecurityResult = result;
      const available = result.violation_assessment_available === true;
      document.getElementById("sensitivity-button").disabled = !available;
      document.getElementById("sensitivity-result").textContent = available ? "Security Analysis 후 민감도를 분석할 수 있습니다." : "상정사고 분석이 수렴하지 않아 민감도 분석을 수행할 수 없습니다.";
    }

    function formatValue(value, unit) { return value == null ? "-" : value.toFixed(2) + (unit ? ` ${unit}` : ""); }
    function formatBoolStatus(value) { return value === true ? "CONVERGED" : value === false ? "NOT CONVERGED" : "-"; }

    function renderSecurityResult(result) {
      const element = document.getElementById("security-result");
      const count = result.violation_assessment_available === true ? (result.violated_equipment_count ?? 0) : "판정 불가";
      let html = `<div><strong>Outage</strong>: ${result.outage_line_id ?? "-"}</div><div><strong>Status</strong>: ${result.post_status ?? "-"}</div><div><strong>Violations</strong>: ${count}</div>`;
      for (const v of result.violations || []) {
        html += `<hr><div><strong>Violated Equipment</strong>: ${v.equipment_id}</div><div><strong>Loading</strong>: ${v.loading_percent == null ? "-" : v.loading_percent.toFixed(2) + " %"}</div><div><strong>Limit</strong>: ${formatValue(v.limit, v.unit)}</div><div><strong>Post-contingency</strong>: ${formatValue(v.value, v.unit)}</div>`;
      }
      element.innerHTML = html;
    }

    function resetSensitivityMarkers() { document.querySelectorAll(".sensitivity-marker").forEach((m) => m.remove()); }
    function resetGeneratorContingencyMarkers() { document.querySelectorAll(".generator-contingency-marker").forEach((m) => m.remove()); }

    function invalidateSecurityResult() {
      latestSecurityResult = null;
      document.getElementById("sensitivity-button").disabled = true;
      document.getElementById("sensitivity-result").textContent = "변경한 사고에 대해 Security Analysis를 먼저 실행하세요.";
      resetSensitivityMarkers();
    }

    async function runSensitivityAnalysis() {
      const outageLineId = document.getElementById("outage-line").value.trim();
      if (!outageLineId) return;
      if (!latestSecurityResult || latestSecurityResult.outage_line_id !== outageLineId) {
        document.getElementById("sensitivity-result").textContent = "현재 사고에 대한 Security Analysis를 먼저 실행하세요.";
        return;
      }
      const resultElement = document.getElementById("sensitivity-result");
      resultElement.textContent = "민감도 분석 중...";
      resetSensitivityMarkers();
      try {
        const response = await fetch("/api/sensitivity-analysis?outage_line_id=" + encodeURIComponent(outageLineId) + "&top_n=5");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        applySensitivityResult(await response.json());
      } catch (error) { resultElement.textContent = `민감도 분석 실패: ${error.message}`; }
    }

    function applySensitivityResult(result) {
      setAnalysisBoxCollapsed("security-analysis-box", false);
      resetSensitivityMarkers();
      const element = document.getElementById("sensitivity-result");
      if (!result.candidates || result.candidates.length === 0) {
        element.textContent = result.message || "민감도 후보가 없습니다.";
        return;
      }
      let html = `<div><strong>Target Line</strong>: ${result.monitored_line_id}</div><div><strong>Top Candidates</strong>: ${result.candidate_count}</div>`;
      result.candidates.forEach((c, i) => { html += `<div class="sensitivity-candidate"><strong>${i + 1}. ${c.generator_id}</strong><div>Bus ${c.bus_id} · ${c.name_korean}</div><div>민감도: ${c.sensitivity.toFixed(4)}</div></div>`; });
      element.innerHTML = html;
      renderSensitivityMarkers(result.candidates);
    }

    function renderSensitivityMarkers(candidates) {
      if (!mapProjection) return;
      const svg = document.getElementById("network-map");
      for (const [busId, generators] of groupByBus(candidates).entries()) {
        const first = generators[0];
        if (first.latitude == null || first.longitude == null) continue;
        const p = mapProjection(first);
        const group = document.createElementNS(SVG_NS, "g"); group.setAttribute("class", "sensitivity-marker analysis-marker");
        const circle = document.createElementNS(SVG_NS, "circle"); circle.setAttribute("cx", p.x); circle.setAttribute("cy", p.y); circle.setAttribute("r", 11);
        const text = document.createElementNS(SVG_NS, "text"); text.setAttribute("x", p.x); text.setAttribute("y", p.y); text.textContent = generators.length;
        group.appendChild(circle); group.appendChild(text);
        group.addEventListener("click", (event) => { event.stopPropagation(); showSensitivityTooltip(event, busId, generators); });
        svg.appendChild(group);
      }
    }

    async function runGeneratorContingencyAnalysis() {
      const generatorId = document.getElementById("outage-generator").value.trim();
      const resultElement = document.getElementById("generator-contingency-result");
      if (!generatorId) { resultElement.textContent = "발전기 ID를 선택하거나 입력하세요."; return; }
      if (!updateGeneratorAnalyzeAvailability()) return;

      const slackMode = document.querySelector('input[name="generator-slack-mode"]:checked').value;
      const button = document.getElementById("generator-analyze-button");
      button.disabled = true;
      resultElement.textContent = "발전기 상정사고 분석 중...";
      hideMapTooltip(false);
      try {
        const response = await fetch("/api/generator-contingency-analysis", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ generator_id: generatorId, slack_mode: slackMode }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || `HTTP ${response.status}`);
        renderGeneratorContingencyResult(result);
        applyGeneratorContingencyResult(result);
      } catch (error) {
        resultElement.textContent = `분석 실패: ${error.message}`;
      } finally {
        updateGeneratorAnalyzeAvailability();
      }
    }

    function renderGeneratorContingencyResult(result) {
      setAnalysisBoxCollapsed("generator-contingency-box", false);
      const element = document.getElementById("generator-contingency-result");
      const outage = result.outage_generator || {};
      const post = result.post_loadflow || {};
      const security = result.security || {};
      const distributed = post.distributed_active_power_mw;
      const mismatch = post.active_power_mismatch_mw;

      let html = `
        <div class="generator-result-row"><strong>Generator</strong>: ${escapeHtml(result.generator_id ?? "-")}</div>
        <div class="generator-result-row"><strong>Bus</strong>: ${outage.bus_id ?? "-"}${outage.name_korean ? ` · ${escapeHtml(outage.name_korean)}` : ""}</div>
        <div class="generator-result-row"><strong>Slack Mode</strong>: ${escapeHtml(result.slack_mode ?? "-")}</div>
        <div class="generator-result-row"><strong>Base LF</strong>: ${formatBoolStatus(result.base_converged)}</div>
        <div class="generator-result-row"><strong>Post LF</strong>: ${formatBoolStatus(result.post_contingency_converged)}</div>
        <div class="generator-result-row"><strong>Pre-outage Generation</strong>: ${formatValue(outage.actual_generation_mw, "MW")}</div>
      `;

      if (result.slack_mode === "distributed") {
        html += `<div class="generator-result-row"><strong>Distributed Balancing</strong>: ${formatValue(distributed, "MW")}</div>`;
        html += `<div class="generator-result-row"><strong>Residual Mismatch</strong>: ${formatValue(mismatch, "MW")}</div>`;
        if (result.balance_type) html += `<div class="generator-result-row"><strong>Balance Type</strong>: ${escapeHtml(result.balance_type)}</div>`;
      } else {
        html += `<div class="generator-result-row"><strong>Active Power Mismatch</strong>: ${formatValue(mismatch, "MW")}</div>`;
      }

      html += `<div class="generator-result-row"><strong>Violations</strong>: ${security.pre_violated_equipment_count ?? 0} → ${security.post_violated_equipment_count ?? 0}</div>`;

      const overloads = result.major_overloads || [];
      if (overloads.length > 0) {
        html += `<div class="generator-result-section"><strong>Major Overloads</strong></div>`;
        for (const item of overloads) {
          html += `<div class="generator-result-row"><strong>${escapeHtml(item.equipment_id)}</strong>: ${formatValue(item.value, item.unit)} / Limit ${formatValue(item.limit, item.unit)}</div>`;
          html += `<div class="generator-result-row">Loading: ${item.loading_percent == null ? "-" : item.loading_percent.toFixed(2) + " %"}</div>`;
        }
      }

      const changes = (result.top_generator_changes || []).filter((item) => Math.abs(item.delta_generation_mw || 0) > 1e-6);
      if (changes.length > 0) {
        html += `<div class="generator-result-section"><strong>Top Generator Changes</strong></div>`;
        for (const item of changes) {
          html += `<div class="generator-result-row"><strong>${escapeHtml(item.generator_id)}</strong>: ${formatValue(item.generation_before_mw, "MW")} → ${formatValue(item.generation_after_mw, "MW")} (${item.delta_generation_mw >= 0 ? "+" : ""}${item.delta_generation_mw.toFixed(2)} MW)</div>`;
        }
      } else if (result.top_generator_changes && result.top_generator_changes.length > 0) {
        html += `<div class="generator-result-section"><strong>Generator Changes</strong>: 0.00 MW</div>`;
      }

      html += `<div class="generator-result-note">Slack 설정은 Load Flow balancing 가정이며 운영자 Redispatch가 아닙니다.</div>`;
      element.innerHTML = html;
    }

    function applyGeneratorContingencyResult(result) {
      resetSecurityHighlight(); resetSensitivityMarkers(); resetGeneratorContingencyMarkers();
      for (const overload of result.major_overloads || []) highlightLine(overload.equipment_id, "violation-line");
      renderGeneratorContingencyMarkers(result);
    }

    function renderGeneratorContingencyMarkers(result) {
      if (!mapProjection) return;
      const svg = document.getElementById("network-map");
      const outage = result.outage_generator;
      if (outage && outage.latitude != null && outage.longitude != null) {
        const p = mapProjection(outage);
        const group = document.createElementNS(SVG_NS, "g"); group.setAttribute("class", "generator-contingency-marker generator-outage-marker analysis-marker");
        const path = document.createElementNS(SVG_NS, "path"); path.setAttribute("d", `M ${p.x} ${p.y - 11} L ${p.x - 11} ${p.y} L ${p.x} ${p.y + 11} L ${p.x + 11} ${p.y} Z`);
        const text = document.createElementNS(SVG_NS, "text"); text.setAttribute("x", p.x); text.setAttribute("y", p.y); text.textContent = "OUT";
        group.appendChild(path); group.appendChild(text);
        group.addEventListener("click", (event) => { event.stopPropagation(); showGeneratorContingencyTooltip(event, `사고 발전기 · Bus ${outage.bus_id}`, [outage]); });
        svg.appendChild(group);
      }
      const changed = (result.top_generator_changes || []).filter((item) => Math.abs(item.delta_generation_mw || 0) > 1e-6);
      for (const [busId, generators] of groupByBus(changed).entries()) {
        const first = generators[0]; if (first.latitude == null || first.longitude == null) continue;
        const p = mapProjection(first);
        const group = document.createElementNS(SVG_NS, "g"); group.setAttribute("class", "generator-contingency-marker generator-change-marker analysis-marker");
        const circle = document.createElementNS(SVG_NS, "circle"); circle.setAttribute("cx", p.x); circle.setAttribute("cy", p.y); circle.setAttribute("r", 10);
        const text = document.createElementNS(SVG_NS, "text"); text.setAttribute("x", p.x); text.setAttribute("y", p.y); text.textContent = generators.length;
        group.appendChild(circle); group.appendChild(text);
        group.addEventListener("click", (event) => { event.stopPropagation(); showGeneratorContingencyTooltip(event, `Balancing 변화 · Bus ${busId}`, generators); });
        svg.appendChild(group);
      }
    }

    function appendChatMessage(role, text) {
      const log = document.getElementById("chat-log");
      const el = document.createElement("div"); el.className = `chat-message ${role}`; el.textContent = text; log.appendChild(el);
      document.getElementById("messages").scrollTop = document.getElementById("messages").scrollHeight;
    }

    async function sendChatMessage() {
      if (chatBusy) return;
      const input = document.getElementById("chat-message"); const button = document.getElementById("chat-send"); const message = input.value.trim();
      if (!message) return;
      appendChatMessage("user", message); input.value = ""; chatBusy = true; button.disabled = true; input.disabled = true;
      try {
        const response = await fetch("/api/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ session_id: getSessionId(), message }) });
        const payload = await response.json(); if (!response.ok) throw new Error(payload.detail || `HTTP ${response.status}`);
        appendChatMessage("agent", payload.answer || "응답이 없습니다.");
        for (const update of payload.ui_updates || []) {
          if (update.type === "security") applySecurityResult(update.result);
          else if (update.type === "sensitivity") applySensitivityResult(update.result);
          else if (update.type === "generator_contingency") {
            document.getElementById("outage-generator").value = update.result.generator_id || "";
            document.querySelector(`input[name="generator-slack-mode"][value="${update.result.slack_mode}"]`)?.click();
            renderGeneratorContingencyResult(update.result);
            applyGeneratorContingencyResult(update.result);
          }
        }
      } catch (error) { appendChatMessage("system", `Agent 오류: ${error.message}`); }
      finally { chatBusy = false; button.disabled = false; input.disabled = false; input.focus(); }
    }

    document.getElementById("analyze-button").addEventListener("click", runSecurityAnalysis);
    document.getElementById("sensitivity-button").addEventListener("click", runSensitivityAnalysis);
    document.getElementById("generator-analyze-button").addEventListener("click", runGeneratorContingencyAnalysis);
    document.getElementById("outage-line").addEventListener("input", invalidateSecurityResult);
    document.getElementById("outage-generator").addEventListener("input", () => {
      const generatorId = document.getElementById("outage-generator").value.trim();
      if (updateGeneratorAnalyzeAvailability() && generatorId) {
        document.getElementById("generator-contingency-result").textContent = `${generatorId} 선택됨. Slack mode를 선택하고 Analyze를 실행하세요.`;
      }
    });
    document.getElementById("chat-send").addEventListener("click", sendChatMessage);
    document.getElementById("chat-message").addEventListener("keydown", (event) => { if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); sendChatMessage(); } });
    for (const id of ["layer-lines", "layer-buses", "layer-generators", "layer-analysis"]) document.getElementById(id).addEventListener("change", applyLayerVisibility);
    document.querySelectorAll(".analysis-box-header").forEach((header) => {
      header.addEventListener("click", (event) => {
        event.preventDefault();
        toggleAnalysisBox(header.dataset.boxId);
      });
    });
    document.getElementById("map-tooltip-close").addEventListener("click", (event) => { event.stopPropagation(); hideMapTooltip(); });
    document.getElementById("map-tooltip").addEventListener("click", (event) => event.stopPropagation());
    document.addEventListener("click", (event) => {
      const tooltip = document.getElementById("map-tooltip");
      if (tooltip.style.display !== "none" && !tooltip.contains(event.target)) hideMapTooltip();
    });

    loadNetworkMap();
  </script>
</body>
</html>
